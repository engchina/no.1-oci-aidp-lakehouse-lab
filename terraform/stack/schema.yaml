title: "Deploy OCI AI Data Platform Lab (ATP + AI Lakehouse + AIDP + OAC + Gradio console)"
stackDescription: "One-click lab for OCI AI Data Platform: creates ATP (OLTP), Autonomous AI Lakehouse, AIDP Workbench, OAC, and a Compute instance running a Gradio setup console that automates the parts Terraform cannot."
schemaVersion: 1.1.0
version: "20260915"
locale: "en"

variableGroups:
  - title: Required Configuration
    visible: true
    variables:
      - region
      - compartment_ocid
      - availability_domain
      - vcn_id

  - title: ATP (OLTP source)
    visible: true
    variables:
      - atp_name
      - atp_display_name
      - atp_password
      - atp_compute_count
      - atp_data_storage_size_in_tbs

  - title: Autonomous AI Lakehouse
    visible: true
    variables:
      - lakehouse_name
      - lakehouse_display_name
      - lakehouse_password
      - lakehouse_compute_count
      - lakehouse_data_storage_size_in_tbs
      - adb_backup_retention_period_in_days
      - adb_license_model

  - title: Database Network (ATP + Lakehouse)
    visible: true
    variables:
      - adb_network_access_type
      - adb_whitelisted_ips
      - adb_subnet_id

  - title: AI Data Platform
    visible: true
    variables:
      - aidp_display_name
      - aidp_workspace_name

  - title: Oracle Analytics Cloud
    visible: true
    variables:
      - oac_name
      - oac_idcs_access_token
      - oac_user_count

  - title: Object Storage (pre-created)
    visible: true
    variables:
      - os_bucket_name

  - title: Compute (Gradio console)
    visible: true
    variables:
      - compute_display_name
      - compute_image_id
      - compute_shape
      - compute_ocpus
      - compute_memory_gb
      - compute_boot_volume_gb
      - compute_boot_volume_vpus
      - subnet_id
      - ssh_authorized_keys
      - app_port
      - app_git_ref
      - app_github_deploy_key_url
      - app_admin_password

variables:
  region:
    title: Region
    type: oci:identity:region:name
    required: true
    visible: false

  compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    visible: true
    title: "Create in compartment"

  availability_domain:
    type: oci:identity:availabilitydomain:name
    required: true
    visible: true
    title: "Availability domain"
    dependsOn:
      region: ${region}
      compartmentId: ${compartment_ocid}

  vcn_id:
    type: oci:core:vcn:id
    required: true
    visible: true
    title: "VCN"
    description: "Select the existing virtual cloud network that contains the Compute subnet."
    dependsOn:
      compartmentId: ${compartment_ocid}

  atp_name:
    type: string
    required: true
    visible: true
    title: "ATP database name"
    default: "AIRLINESOURCE01"

  atp_display_name:
    type: string
    required: true
    visible: true
    title: "ATP display name"
    default: "aidp-lab-atp"

  atp_password:
    type: password
    required: true
    visible: true
    title: "ATP admin password"
    description: "Password for the ATP ADMIN user (12-30 chars, upper/lower case + digit, no quotes)."
    confirmation: true
    pattern: "^(?!.*admin)(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?!.*[\"]).{12,30}$"

  atp_compute_count:
    type: number
    required: true
    visible: true
    title: "ATP ECPU count"
    default: 20

  atp_data_storage_size_in_tbs:
    type: number
    required: true
    visible: true
    title: "ATP storage (TB)"
    default: 0.05

  lakehouse_name:
    type: string
    required: true
    visible: true
    title: "AI Lakehouse database name"
    default: "AIDPDB01"

  lakehouse_display_name:
    type: string
    required: true
    visible: true
    title: "AI Lakehouse display name"
    default: "aidp-lab-lakehouse"

  lakehouse_password:
    type: password
    required: true
    visible: true
    title: "AI Lakehouse admin password"
    description: "Password for the Lakehouse ADMIN user (12-30 chars, upper/lower case + digit, no quotes)."
    confirmation: true
    pattern: "^(?!.*admin)(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?!.*[\"]).{12,30}$"

  lakehouse_compute_count:
    type: number
    required: true
    visible: true
    title: "AI Lakehouse ECPU count"
    default: 8

  lakehouse_data_storage_size_in_tbs:
    type: number
    required: true
    visible: true
    title: "AI Lakehouse storage (TB)"
    default: 0.05

  adb_backup_retention_period_in_days:
    type: number
    required: true
    visible: true
    title: "ADB backup retention (days)"
    default: 1

  adb_license_model:
    type: enum
    required: true
    visible: true
    title: "ADB license"
    enum:
      - "LICENSE_INCLUDED"
      - "BRING_YOUR_OWN_LICENSE"
    default: "LICENSE_INCLUDED"

  adb_network_access_type:
    type: enum
    required: true
    visible: true
    title: "ADB network access type"
    description: "Network access for both ATP and AI Lakehouse. PUBLIC: secure access from any location (public endpoint, default for this lab). SECURE_ACL: access restricted to the allowed IPs/VCNs you list. PRIVATE: private endpoint only, attached to the subnet you select."
    enum:
      - "PUBLIC"
      - "SECURE_ACL"
      - "PRIVATE"
    default: "PUBLIC"

  adb_whitelisted_ips:
    type: string
    required: false
    visible:
      eq:
        - adb_network_access_type
        - "SECURE_ACL"
    title: "Allowed source IPs / VCNs (for SECURE_ACL)"
    description: "Comma-separated CIDR blocks (e.g. 10.0.0.0/24) and/or VCN OCIDs (ocid1.vcn.oc1..). Include the CIDR of the Compute subnet if the Gradio console must connect to the databases."

  adb_subnet_id:
    type: oci:core:subnet:id
    required: false
    visible:
      eq:
        - adb_network_access_type
        - "PRIVATE"
    title: "Private endpoint subnet (for PRIVATE)"
    description: "Subnet in which the private endpoints of both databases are attached. Use a subnet of the selected VCN (same VCN as the Compute instance is required for private connectivity)."
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${vcn_id}

  aidp_display_name:
    type: string
    required: true
    visible: true
    title: "AIDP instance display name"
    default: "aidp-lab-workbench"

  aidp_workspace_name:
    type: string
    required: true
    visible: true
    title: "AIDP default workspace name"
    default: "aidp-lab-workspace"

  oac_name:
    type: string
    required: true
    visible: true
    title: "OAC instance name"
    description: "Must be unique in the tenancy. Cannot be changed after creation."
    default: "aidp-lab-oac"

  oac_idcs_access_token:
    type: password
    required: true
    visible: true
    title: "OAC IDCS access token"
    description: "Generate under Identity and Security > Identity Domains > default > Users > (your user) > Access Tokens, then paste it here. Required to create the OAC instance via Terraform."

  oac_user_count:
    type: number
    required: true
    visible: true
    title: "OAC user capacity"
    default: 2

  os_bucket_name:
    type: string
    required: true
    visible: true
    title: "Object Storage bucket name (pre-created)"
    description: "Existing bucket that AIDP will use for Delta data (delta/ prefix). Create it manually beforehand."
    default: "aidp-lab-bucket_01"

  compute_display_name:
    type: string
    required: true
    visible: true
    title: "Compute instance name"
    default: "aidp-lab-compute"

  compute_image_id:
    type: oci:core:image:id
    required: true
    visible: true
    title: "Compute OS image"
    default: "ocid1.image.oc1.ap-osaka-1.aaaaaaaa7sbmd5q54w466eojxqwqfvvp554awzjpt2behuwsiefrxnwomq5a"
    dependsOn:
      compartmentId: ${compartment_ocid}

  compute_shape:
    type: enum
    required: true
    visible: true
    title: "Compute shape"
    enum:
      - "VM.Standard.E4.Flex"
      - "VM.Standard.E5.Flex"
    default: "VM.Standard.E4.Flex"

  compute_ocpus:
    type: number
    required: true
    visible: true
    title: "Compute OCPUs"
    default: 2

  compute_memory_gb:
    type: number
    required: true
    visible: true
    title: "Compute memory (GB)"
    default: 16

  compute_boot_volume_gb:
    type: number
    required: true
    visible: true
    title: "Boot volume size (GB)"
    default: 100

  compute_boot_volume_vpus:
    type: number
    required: true
    visible: true
    title: "Boot volume VPUs per GB"
    default: 10

  subnet_id:
    type: oci:core:subnet:id
    required: true
    visible: true
    title: "Compute subnet"
    description: "Pick a public subnet if you want to reach the Gradio console from the internet."
    dependsOn:
      vcnId: ${vcn_id}
      compartmentId: ${compartment_ocid}

  ssh_authorized_keys:
    type: string
    required: true
    visible: true
    title: "SSH authorized keys"
    description: "Paste your SSH public key."

  app_port:
    type: number
    required: true
    visible: true
    title: "Gradio application port"
    default: 8080

  app_git_ref:
    type: string
    required: true
    visible: true
    title: "Application Git ref"
    default: "main"

  app_github_deploy_key_url:
    type: string
    required: true
    visible: true
    title: "GitHub deploy key PAR URL"
    description: "Object Storage pre-authenticated request URL of this repository's GitHub deploy key (private key)."

  app_admin_password:
    type: password
    required: true
    visible: true
    title: "Gradio console admin password"
    description: "Web UI password for the ADMIN login of the Gradio console."
    confirmation: true
